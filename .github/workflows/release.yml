name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AE2 Sub-Pattern Provider ${{ github.ref_name || inputs.version }}
          tag_name: ${{ github.ref_name || inputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            build/libs/ae2subnet-*.jar
            logo.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN || secrets.CF_TOKEN || secrets.CURSEFORGE_API_KEY || secrets.CURSE_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || secrets.CF_PROJECT_ID || secrets.CURSE_PROJECT_ID || secrets.CURSEFORGE_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN || secrets.MODRINTH_API_KEY }}
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || secrets.MODRINTH_ID }}
          files: |
            build/libs/ae2subnet-*.jar
          name: AE2 Sub-Pattern Provider ${{ github.ref_name || inputs.version }}
          version: ${{ github.ref_name || inputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            neoforge
          game-versions: |
            26.1.2
          java: Java 25
